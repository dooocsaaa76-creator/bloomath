window.deletePLStudent = function(sid) {
  const stu = pl_db.students[sid];
  showConfirm(`'${stu?.name}' 학생을 전체 명단에서 삭제할까요?\n(모든 반에서도 삭제되며, 발송 이력은 유지됩니다)`, async () => {
    // 모든 반에서 제거
    Object.values(pl_db.classes).forEach(data => {
      data.students = (data.students||[]).filter(s => s.id !== sid);
    });
    delete pl_db.students[sid];
    await savePLDB();
    render();
    showToast('🗑️ 학생이 삭제되었습니다');
  });
};

window.editPLStu=function(sid){
  const stu=pl_db.students[sid]; if(!stu)return;
  // 이 학생이 속한 반 목록
  const myClassIds=new Set();
  pl_db.terms.forEach(term=>term.classes.forEach(cls=>{
    if(pl_db.classes[cls.id]?.students?.some(s=>s.id===sid)) myClassIds.add(cls.id);
  }));
  // 1번: 현재 열람 중인 분기(또는 같은 venue 최신 분기)의 반만 추가 가능 목록에 표시
  const currentTermId = window._plCurrentTermId;
  const currentTerm = currentTermId ? getPLTerm(currentTermId) : null;
  // 현재 분기가 없으면 모든 분기 표시 (fallback)
  const addableCls = [];
  if (currentTerm) {
    currentTerm.classes.forEach(cls => {
      if (!myClassIds.has(cls.id)) addableCls.push({termId:currentTerm.id, termName:currentTerm.name, cls});
    });
  } else {
    pl_db.terms.forEach(term=>term.classes.forEach(cls=>{
      if (!myClassIds.has(cls.id)) addableCls.push({termId:term.id, termName:term.name, cls});
    }));
  }

  document.getElementById('modalTitle').textContent=`학생 정보 수정 — ${stu.name}`;
  document.getElementById('modalContent').innerHTML=`
    <div style="display:flex;flex-direction:column;gap:12px;">
      <div><label>학교</label><input type="text" id="eSch" value="${escapeHtml(stu.school||'')}" style="width:100%;"></div>
      <div><label>학년</label><select id="eGrd" style="width:100%;"><option value="">선택</option>
        ${['초1','초2','초3','초4','초5','초6','중1','중2','중3','고1','고2','고3'].map(g=>`<option ${stu.grade===g?'selected':''}>${g}</option>`).join('')}
      </select></div>
      <div><label>수강과정</label><input type="text" id="eCrs" value="${escapeHtml(stu.course||'')}" style="width:100%;"></div>
      <div><label>수업기간</label><input type="text" id="ePrd" value="${escapeHtml(stu.period||'')}" style="width:100%;"></div>
      <div><label>종료월</label><input type="text" id="eEnd" value="${escapeHtml(stu.endMonth||'')}" style="width:100%;"></div>
      <div><label>특이사항</label><textarea id="eMemo" style="width:100%;min-height:60px;">${escapeHtml(stu.memo||'')}</textarea></div>
      <div>
        <label style="display:flex;align-items:center;gap:6px;">
          💬 카카오 채팅 URL
          <span style="font-size:11px;color:var(--text-secondary);font-weight:400;">(학부모 1:1 채팅방 주소)</span>
        </label>
        <input type="text" id="eKakao" value="${escapeHtml(stu.kakaoUrl||'')}" placeholder="https://business.kakao.com/space/.../chats/..." style="width:100%;font-size:12px;">
      </div>
      <!-- 수강반 관리 -->
      <div style="border-top:1px solid var(--border);padding-top:12px;">
        <label style="font-weight:700;font-size:13px;display:block;margin-bottom:8px;">📅 수강 중인 반</label>
        <div id="myClassList" style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px;">
          ${[...myClassIds].map(cid=>{
            const cls=pl_db.terms.flatMap(t=>t.classes).find(c=>c.id===cid);
            const term=pl_db.terms.find(t=>t.classes.some(c=>c.id===cid));
            return cls?`<span style="background:var(--primary-light);color:var(--primary);border:1px solid #C7D2FE;padding:4px 10px;border-radius:10px;font-size:12px;font-weight:600;display:inline-flex;align-items:center;gap:6px;">
              ${escapeHtml(cls.name)} <span style="font-size:10px;color:var(--text-secondary);">${escapeHtml(term?.name||'')}</span>
              <button onclick="window.removeStuFromClass('${sid}','${cid}')" style="background:none;border:none;color:#EF4444;cursor:pointer;font-size:14px;padding:0;line-height:1;">×</button>
            </span>`:'';
          }).join('') || '<span style="color:var(--text-secondary);font-size:12px;">없음</span>'}
        </div>
        <label style="font-size:12px;font-weight:600;color:var(--text-secondary);display:block;margin-bottom:4px;">반 추가</label>
        <div style="display:flex;gap:6px;">
          <select id="eAddClass" style="flex:1;font-size:12px;">
            <option value="">— 반 선택 —</option>
            ${addableCls.map(({termId,termName,cls})=>
              `<option value="${cls.id}">${escapeHtml(termName)} › ${escapeHtml(cls.name)}</option>`
            ).join('')}
          </select>
          <button class="btn btn-pl btn-sm" onclick="window.addStuToClass('${sid}')">추가</button>
        </div>
      </div>
    </div>`;
  document.getElementById('modalFooter').innerHTML=`
    <button class="btn btn-primary" onclick="window.savePLStu('${sid}')">💾 저장</button>
    <button class="btn btn-outline" onclick="window.closeModal()">취소</button>`;
  document.getElementById('modal').style.display='block';
};

window.addStuToClass = async function(sid) {
  const classId = document.getElementById('eAddClass').value;
  if (!classId) { showToast('⚠️ 반을 선택해주세요'); return; }
  const data = getPLClassData(classId);
  if (data.students.some(s => s.id === sid)) { showToast('⚠️ 이미 수강 중인 반입니다'); return; }
  const stu = pl_db.students[sid];
  data.students.push({ id: sid, name: stu.name });
  await savePLDB();
  showToast('✅ 반 추가 완료', 'success');
  window.editPLStu(sid); // 모달 새로고침
};

window.removeStuFromClass = async function(sid, classId) {
  const cls = pl_db.terms.flatMap(t=>t.classes).find(c=>c.id===classId);
  showConfirm(`'${cls?.name}' 반에서 삭제할까요?`, async () => {
    const data = getPLClassData(classId);
    data.students = data.students.filter(s => s.id !== sid);
    await savePLDB();
    showToast('🗑️ 반에서 삭제됨');
    window.editPLStu(sid); // 모달 새로고침
  });
};
window.savePLStu=async function(sid){
  const stu=pl_db.students[sid];
  stu.school=document.getElementById('eSch').value.trim();
  stu.grade=document.getElementById('eGrd').value;
  stu.course=document.getElementById('eCrs').value.trim();
  stu.period=document.getElementById('ePrd').value.trim();
  stu.endMonth=document.getElementById('eEnd').value.trim();
  stu.memo=document.getElementById('eMemo').value.trim();
  stu.kakaoUrl=document.getElementById('eKakao').value.trim();
  await savePLDB(); window.closeModal(); render(); showToast('✅ 저장되었습니다','success');
};

        <div style="font-size:12px;font-weight:600;color:var(--text-secondary);margin-bottom:5px;">생성된 코멘트 붙여넣기:</div>
        <textarea id="aiResultInput" placeholder="Claude가 생성한 코멘트를 여기에 붙여넣기..."
          style="width:100%;min-height:130px;border:1.5px solid var(--border);border-radius:8px;padding:10px;font-family:inherit;font-size:13px;resize:vertical;line-height:1.7;box-sizing:border-box;"></textarea>
      </div>
      <details>
        <summary style="font-size:12px;color:var(--text-secondary);cursor:pointer;user-select:none;">📄 복사된 프롬프트 확인</summary>
        <pre style="margin-top:6px;padding:10px;background:var(--surface2);border-radius:8px;font-size:11px;line-height:1.6;white-space:pre-wrap;word-break:break-all;max-height:160px;overflow-y:auto;">${escapeHtml(prompt)}</pre>
      </details>
    </div>
  `;
  document.getElementById('modalFooter').innerHTML = `
    <button class="btn btn-primary" onclick="window.applyAIComment('${targetId}')">✅ 코멘트 적용</button>
    <button class="btn btn-outline" onclick="window.closeModal()">닫기</button>
  `;
  document.getElementById('modal').style.display = 'block';
  // 붙여넣기 자동 포커스
  setTimeout(() => document.getElementById('aiResultInput')?.focus(), 300);
}

window.applyAIComment = function(targetId) {
  const result = document.getElementById('aiResultInput')?.value?.trim();
  if (!result) { showToast('⚠️ 코멘트를 붙여넣기 해주세요'); return; }
  const el = document.getElementById(targetId);
  if (el) { el.value = result; el.dispatchEvent(new Event('input')); }
  // PL 미리보기 업데이트
  if (targetId.startsWith('plCmt_')) {
    const sid = targetId.replace('plCmt_', '');
    if (window.updatePLPreview) window.updatePLPreview(sid);
  }
  window.closeModal();
  showToast('✅ 코멘트가 적용되었습니다!', 'success');
};

// ── BM 코멘트 생성 ──────────────────────────────────────
window.generateBMComment = function() {
  const date    = document.getElementById('date')?.value || '';
  const prog    = document.getElementById('progress')?.value || '';
  const hw      = document.getElementById('homework')?.value || '';
  const keyword = document.getElementById('bmKeyword')?.value?.trim() || '';
  const stuEl   = document.querySelector('.tab-btn.active');
  const stuName = stuEl?.textContent?.trim().replace(/[✓✔]/g,'').trim() || '';

  if (!stuName) { showToast('⚠️ 학생을 먼저 선택해주세요'); return; }
  if (!prog && !keyword) { showToast('⚠️ 진도 또는 키워드를 입력해주세요'); return; }

  const kwLine = keyword ? `키워드/특이사항: ${keyword}` : '';
  const hwLine = hw ? `가정학습 과제: ${hw}` : '';

  const prompt = `당신은 초등·중등 수학학원(MATHMILE) 선생님입니다.
아래 정보를 바탕으로 학부모님께 보내는 수업 안내 코멘트를 작성해주세요.

─ 수업 정보 ─
학생명: ${stuName}
수업날짜: ${date}
오늘 진도: ${prog}
${hwLine}
${kwLine}

─ 작성 방식 ─
• "안녕하세요^^"로 시작
• 오늘 배운 단원의 핵심 특징이나 어려울 수 있는 점을 한두 문장으로 짚어주기
• 키워드가 있으면 자연스럽게 반영
• TEST 점수, 과제이행 등급은 절대 언급하지 말 것 (문자 상단에 따로 표기됨)
• 총 3~5문장, 너무 과하지 않고 진심 어린 톤
• 코멘트 본문만 출력 (설명·제목 없이)

─ 참고 스타일 예시 ─
${AI_COMMENT_EXAMPLES}`;

  showAIModal(prompt, 'comment');
};

// ── PL 코멘트 생성 ──────────────────────────────────────
window.generatePLComment = function(sid) {
  const stu = pl_db.students[sid];
  if (!stu) { showToast('⚠️ 학생 정보가 없습니다'); return; }

  const g = id => document.getElementById(id)?.value?.trim() || '';
  const course  = g('plCourse_'+sid) || stu.course || '';
  const date    = g('plDate_'+sid) || '';
  const sessNum = g('plSess_'+sid) || '';
  const lclass  = g('plLC_'+sid) || '';
  const hw      = g('plHW_'+sid) || '';
  const keyword = g('plKeyword_'+sid) || '';

  if (!lclass && !keyword) { showToast('⚠️ L-Class 진도 또는 키워드를 입력해주세요'); return; }

  const infoLines = [
    `학생명: ${stu.name}`,
    course  ? `수강 과정: ${course}` : '',
    date    ? `수업날짜: ${date}` : '',
    sessNum ? `회차: ${sessNum}회차` : '',
    lclass  ? `오늘 진도: ${lclass}` : '',
    hw      ? `가정학습 과제: ${hw}` : '',
    keyword ? `키워드/특이사항: ${keyword}` : '',
  ].filter(Boolean).join('\n');

  const prompt = `당신은 초등·중등 수학 개인지도(PL) 선생님입니다.
아래 정보를 바탕으로 학부모님께 보내는 수업 안내 코멘트를 작성해주세요.

─ 수업 정보 ─
${infoLines}

─ 작성 방식 ─
• "안녕하세요^^"로 시작
• 오늘 배운 단원의 핵심 내용이나 어려울 수 있는 점을 짚어주기
• 키워드가 있으면 자연스럽게 반영
• TEST 점수, 과제이행 등급은 절대 언급하지 말 것 (문자 상단에 따로 표기됨)
• 총 3~5문장, 너무 과하지 않고 진심 어린 톤
• 코멘트 본문만 출력 (설명·제목 없이)

─ 참고 스타일 예시 ─
${AI_COMMENT_EXAMPLES}`;

  showAIModal(prompt, 'plCmt_'+sid);
};

// 안전장치: 5초 후에도 로딩 중이면 강제로 홈 화면 표시
setTimeout(() => {
  if (!isInitialized) {
    console.warn('Firebase 연결 지연 — 강제 진입');
    db = { quarters: [] };
    pl_db = { classes: {}, students: {} };
    isInitialized = true;
    isPLInitialized = true;
    hideLoading();
    view = { page: 'main' };
    render();
    showToast('⚠️ 연결이 지연되고 있습니다. 새로고침을 시도해주세요.');
  }
}, 5000);
</script>
