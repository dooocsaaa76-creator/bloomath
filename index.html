<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CMS서초영재관 문자 시트</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&display=swap');

  :root {
    --bg: #F7F8FC;
    --surface: #FFFFFF;
    --surface2: #F0F2FA;
    --primary: #4361EE;
    --primary-dark: #3451d1;
    --primary-light: #EEF1FD;
    --accent: #F72585;
    --text: #1A1D2E;
    --text-secondary: #6B7280;
    --border: #E5E8F0;
    --success: #10B981;
    --success-light: #ECFDF5;
    --radius: 12px;
    --shadow: 0 2px 12px rgba(67,97,238,0.08);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Noto Sans KR', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }

  /* HEADER */
  header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 0 32px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    height: 60px;
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: 0 1px 8px rgba(0,0,0,0.05);
  }

  .logo {
    display: flex;
    align-items: center;
    gap: 10px;
    font-weight: 700;
    font-size: 18px;
    color: var(--primary);
    cursor: pointer;
  }

  .logo-dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: var(--accent);
  }

  .header-right {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .header-badge {
    font-size: 12px;
    background: var(--primary-light);
    color: var(--primary);
    padding: 4px 10px;
    border-radius: 20px;
    font-weight: 500;
  }

  .save-indicator {
    font-size: 11px;
    color: var(--text-secondary);
    display: flex;
    align-items: center;
    gap: 5px;
  }
  .save-indicator .dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--success);
  }

  /* BREADCRUMB */
  .breadcrumb {
    max-width: 1200px;
    margin: 0 auto;
    padding: 16px 24px 0;
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 13px;
    color: var(--text-secondary);
    flex-wrap: wrap;
  }
  .breadcrumb span.crumb {
    cursor: pointer;
  }
  .breadcrumb span.crumb:hover { color: var(--primary); text-decoration: underline; }
  .breadcrumb span.current { color: var(--text); font-weight: 600; }
  .breadcrumb .sep { color: var(--border); }

  .container {
    max-width: 1200px;
    margin: 0 auto;
    padding: 20px 24px 40px;
  }

  /* PAGE TITLE */
  .page-title-row {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    margin-bottom: 24px;
    flex-wrap: wrap;
    gap: 12px;
  }
  .page-title {
    font-size: 24px;
    font-weight: 900;
  }
  .page-subtitle {
    font-size: 13px;
    color: var(--text-secondary);
    margin-top: 4px;
  }

  /* TOOLBAR (생성 버튼 영역) */
  .toolbar {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 20px 24px;
    margin-bottom: 28px;
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
  }

  .toolbar label {
    font-size: 12px;
    font-weight: 600;
    color: var(--text-secondary);
    margin-right: 2px;
  }

  select, input[type="text"], input[type="month"], textarea {
    border: 1.5px solid var(--border);
    border-radius: 8px;
    padding: 10px 12px;
    font-family: 'Noto Sans KR', sans-serif;
    font-size: 13.5px;
    color: var(--text);
    background: var(--surface);
    transition: border-color 0.15s, box-shadow 0.15s;
  }
  select:focus, input:focus, textarea:focus {
    outline: none;
    border-color: var(--primary);
    box-shadow: 0 0 0 3px rgba(67,97,238,0.12);
  }

  input[type="text"], textarea { width: 100%; resize: vertical; }
  textarea { min-height: 90px; line-height: 1.6; }

  /* ROSTER (학생 명단) */
  .roster-form {
    display: grid;
    grid-template-columns: 1.4fr 1.4fr 0.8fr 1fr 1fr auto;
    gap: 8px;
    align-items: center;
  }
  .roster-input { width: 100%; }
  .roster-table { width: 100%; border-collapse: collapse; font-size: 13px; margin-top: 4px; }
  .roster-table th {
    text-align: left;
    padding: 9px 10px;
    background: var(--surface2);
    font-size: 11.5px;
    color: var(--text-secondary);
    text-transform: uppercase;
    letter-spacing: 0.03em;
    border-bottom: 1.5px solid var(--border);
  }
  .roster-table td {
    padding: 9px 10px;
    border-bottom: 1px solid var(--border);
  }
  .roster-table tr.selected-row { background: var(--primary-light); }
  @media (max-width: 900px) {
    .roster-form { grid-template-columns: 1fr 1fr; }
  }

  /* BOX GRID (분기 박스 / 반 박스) */
  .box-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
    gap: 16px;
  }

  .entity-box {
    background: var(--surface);
    border: 1.5px solid var(--border);
    border-radius: var(--radius);
    padding: 22px 18px;
    cursor: pointer;
    transition: all 0.18s;
    position: relative;
    box-shadow: var(--shadow);
    text-align: center;
  }
  .entity-box:hover {
    border-color: var(--primary);
    transform: translateY(-3px);
    box-shadow: 0 8px 20px rgba(67,97,238,0.18);
  }
  .entity-box .emoji {
    font-size: 28px;
    margin-bottom: 10px;
  }
  .entity-box .name {
    font-weight: 700;
    font-size: 15px;
    margin-bottom: 4px;
  }
  .entity-box .meta {
    font-size: 11.5px;
    color: var(--text-secondary);
  }
  .entity-box .del-btn {
    position: absolute;
    top: 8px;
    right: 8px;
    width: 22px;
    height: 22px;
    border-radius: 50%;
    border: none;
    background: var(--surface2);
    color: var(--text-secondary);
    font-size: 12px;
    cursor: pointer;
    display: none;
    align-items: center;
    justify-content: center;
  }
  .entity-box:hover .del-btn { display: flex; }
  .entity-box .del-btn:hover { background: #FEE2E2; color: #EF4444; }

  /* 담임명 */
  .teacher-badge {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    background: #FFF3E0;
    color: #F59E0B;
    border: 1px solid #FDE68A;
    font-size: 12px;
    font-weight: 700;
    padding: 3px 10px;
    border-radius: 12px;
    margin-left: 8px;
    vertical-align: middle;
  }
  .teacher-input-row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 0;
  }

  .empty-state {
    text-align: center;
    padding: 50px 20px;
    color: var(--text-secondary);
    font-size: 13.5px;
  }
  .empty-state .big-emoji { font-size: 40px; margin-bottom: 12px; }

  /* CARDS (입력화면) */
  .layout {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
  }

  .card {
    background: var(--surface);
    border-radius: var(--radius);
    border: 1px solid var(--border);
    box-shadow: var(--shadow);
    overflow: hidden;
  }

  .card-header {
    padding: 16px 20px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .card-icon {
    width: 32px;
    height: 32px;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 15px;
    flex-shrink: 0;
  }

  .icon-common { background: var(--primary-light); }
  .icon-individual { background: #FFF3E0; }
  .icon-result { background: var(--success-light); }
  .icon-students { background: #F3E8FF; }

  .card-title { font-size: 14px; font-weight: 600; }
  .card-subtitle { font-size: 11px; color: var(--text-secondary); margin-top: 1px; }
  .card-body { padding: 20px; }

  .field { margin-bottom: 14px; }

  label {
    display: block;
    font-size: 12px;
    font-weight: 600;
    color: var(--text-secondary);
    margin-bottom: 6px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }

  /* STUDENT TABS */
  .student-tabs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 16px; }

  .tab-btn {
    padding: 6px 14px;
    border-radius: 20px;
    border: 1.5px solid var(--border);
    background: var(--surface);
    font-size: 12.5px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.15s;
    color: var(--text-secondary);
    font-family: 'Noto Sans KR', sans-serif;
  }
  .tab-btn:hover { border-color: var(--primary); color: var(--primary); }
  .tab-btn.active { background: var(--primary); border-color: var(--primary); color: #fff; }
  .tab-btn.add-btn { border-style: dashed; color: var(--primary); border-color: var(--primary); }
  .tab-btn.add-btn:hover { background: var(--primary-light); }

  /* RESULT BOX */
  .result-box {
    background: var(--surface2);
    border: 1.5px solid var(--border);
    border-radius: 8px;
    padding: 14px;
    font-size: 13.5px;
    line-height: 1.75;
    white-space: pre-wrap;
    word-break: break-all;
    min-height: 200px;
    max-height: 420px;
    overflow-y: auto;
  }
  .result-placeholder { color: var(--text-secondary); font-style: italic; font-size: 13px; }

  /* BUTTONS */
  .btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 9px 16px;
    border-radius: 8px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    border: none;
    transition: all 0.15s;
    font-family: 'Noto Sans KR', sans-serif;
    white-space: nowrap;
  }
  .btn-primary { background: var(--primary); color: #fff; }
  .btn-primary:hover { background: var(--primary-dark); transform: translateY(-1px); box-shadow: 0 4px 12px rgba(67,97,238,0.3); }
  .btn-outline { background: var(--surface); color: var(--text); border: 1.5px solid var(--border); }
  .btn-outline:hover { border-color: var(--primary); color: var(--primary); }
  .btn-success { background: var(--success); color: #fff; }
  .btn-success:hover { background: #059669; transform: translateY(-1px); }
  .btn-danger { background: #FEF2F2; color: #EF4444; border: 1.5px solid #FEE2E2; }
  .btn-danger:hover { background: #FEE2E2; }
  .btn-stat { background: linear-gradient(135deg,#7C3AED,#A855F7); color: #fff; }
  .btn-stat:hover { transform: translateY(-1px); box-shadow: 0 4px 12px rgba(124,58,237,0.35); }
  .btn-sm { padding: 6px 12px; font-size: 12px; }

  .actions { display: flex; gap: 8px; margin-top: 14px; flex-wrap: wrap; }

  /* STUDENT LIST PANEL (with 날짜/이름/전체 columns) */
  .msg-table { width: 100%; border-collapse: collapse; font-size: 13px; }
  .msg-table th {
    text-align: left;
    padding: 10px 12px;
    background: var(--surface2);
    font-size: 11.5px;
    color: var(--text-secondary);
    text-transform: uppercase;
    letter-spacing: 0.03em;
    border-bottom: 1.5px solid var(--border);
  }
  .msg-table td {
    padding: 10px 12px;
    border-bottom: 1px solid var(--border);
    vertical-align: top;
  }
  .msg-table tr.clickable { cursor: pointer; transition: background 0.15s; }
  .msg-table tr.clickable:hover { background: var(--primary-light); }
  .msg-table .col-date { width: 90px; font-weight: 600; white-space: nowrap; }
  .msg-table .col-name { width: 100px; font-weight: 600; }
  .msg-table .col-full {
    color: var(--text-secondary);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    max-width: 1px;
  }

  /* TOAST */
  .toast {
    position: fixed;
    bottom: 24px;
    right: 24px;
    background: var(--text);
    color: #fff;
    padding: 12px 18px;
    border-radius: 10px;
    font-size: 13.5px;
    font-weight: 500;
    box-shadow: 0 8px 24px rgba(0,0,0,0.2);
    transform: translateY(80px);
    opacity: 0;
    transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    z-index: 999;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .toast.show { transform: translateY(0); opacity: 1; }
  .toast.success { background: var(--success); }

  .divider { height: 1px; background: var(--border); margin: 16px 0; }

  .char-count { text-align: right; font-size: 11px; color: var(--text-secondary); margin-top: 4px; }
  .char-count.over { color: var(--accent); font-weight: 600; }

  @keyframes highlight { 0% { background: #FFFDE7; } 100% { background: var(--surface2); } }
  .result-box.updated { animation: highlight 1s ease; }

  /* MODAL */
  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(15,18,35,0.55);
    z-index: 500;
    overflow-y: auto;
    padding: 40px 20px;
  }
  /* 문자 내용 팝업은 통계 모달 위에 표시 */
  #modal { z-index: 600; }
  /* 확인 모달은 항상 최상단 */
  #confirmModal { z-index: 700; }
  .modal-box {
    max-width: 760px;
    margin: 0 auto;
    background: #fff;
    border-radius: 16px;
    overflow: hidden;
  }
  .modal-header {
    padding: 20px 24px;
    border-bottom: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .modal-header .title { font-weight: 700; font-size: 16px; }
  .modal-close { border: none; background: none; font-size: 20px; cursor: pointer; color: #999; line-height:1; }
  .modal-body { padding: 24px; }
  .modal-footer { padding: 16px 24px; border-top: 1px solid var(--border); display: flex; gap: 8px; }

  /* STATS */
  .stat-summary {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(150px,1fr));
    gap: 14px;
    margin-bottom: 24px;
  }
  .stat-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 18px;
    box-shadow: var(--shadow);
  }
  .stat-card .num { font-size: 26px; font-weight: 900; color: var(--primary); }
  .stat-card .lbl { font-size: 12px; color: var(--text-secondary); margin-top: 4px; }

  .stat-section {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    margin-bottom: 20px;
    overflow: hidden;
  }
  .stat-section-header {
    padding: 14px 20px;
    background: var(--surface2);
    font-weight: 700;
    font-size: 13.5px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .stat-section-body { padding: 8px 0; }

  .stat-row {
    padding: 12px 20px;
    border-bottom: 1px solid var(--border);
    cursor: pointer;
    transition: background 0.15s;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .stat-row:last-child { border-bottom: none; }
  .stat-row:hover { background: var(--primary-light); }
  .stat-row .left { display:flex; align-items:center; gap:10px; }
  .stat-row .badge {
    font-size: 11px;
    background: var(--primary-light);
    color: var(--primary);
    padding: 3px 9px;
    border-radius: 12px;
    font-weight: 600;
  }
  .stat-row .count { font-size: 12px; color: var(--text-secondary); }
  .stat-row .name-text { font-weight: 600; font-size: 13.5px; }
  .stat-row .sub-text { font-size: 11.5px; color: var(--text-secondary); margin-top:2px; }

  @media (max-width: 768px) {
    .layout { grid-template-columns: 1fr; }
    header { padding: 0 16px; }
    .container { padding: 16px; }
    .breadcrumb { padding: 12px 16px 0; }
    .msg-table .col-full { display: none; }
  }

  /* ── PL 전용 CSS ── */
  .main-menu-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 24px;
    max-width: 700px;
    margin: 60px auto 0;
  }
  .main-menu-card {
    background: var(--surface);
    border-radius: 18px;
    border: 1.5px solid var(--border);
    box-shadow: var(--shadow);
    padding: 40px 30px;
    text-align: center;
    cursor: pointer;
    transition: all 0.2s;
  }
  .main-menu-card:hover { transform: translateY(-4px); box-shadow: 0 12px 28px rgba(67,97,238,0.18); border-color: var(--primary); }
  .main-menu-card .icon { font-size: 48px; margin-bottom: 16px; }
  .main-menu-card .title { font-size: 20px; font-weight: 900; margin-bottom: 6px; }
  .main-menu-card .desc { font-size: 13px; color: var(--text-secondary); line-height: 1.5; }
  .main-menu-card.pl { border-color: #F59E0B; }
  .main-menu-card.pl:hover { box-shadow: 0 12px 28px rgba(245,158,11,0.2); }

  /* PL 반 탭 */
  .pl-venue-tabs { display: flex; gap: 8px; margin-bottom: 20px; flex-wrap: wrap; }
  .pl-venue-tab {
    padding: 8px 20px; border-radius: 20px; border: 1.5px solid var(--border);
    background: var(--surface); font-size: 13px; font-weight: 600; cursor: pointer;
    transition: all 0.15s; color: var(--text-secondary); font-family: inherit;
  }
  .pl-venue-tab.active { background: #F59E0B; border-color: #F59E0B; color: #fff; }
  .pl-venue-tab:hover:not(.active) { border-color: #F59E0B; color: #F59E0B; }

  .pl-class-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px,1fr)); gap: 10px; margin-bottom: 28px; }
  .pl-class-btn {
    background: var(--surface); border: 1.5px solid var(--border); border-radius: 10px;
    padding: 12px 10px; text-align: center; cursor: pointer; transition: all 0.15s; font-family: inherit;
  }
  .pl-class-btn:hover { border-color: #F59E0B; }
  .pl-class-btn.active { background: #FFF8E6; border-color: #F59E0B; }
  .pl-class-btn .cls-name { font-weight: 700; font-size: 13.5px; }
  .pl-class-btn .cls-time { font-size: 11px; color: var(--text-secondary); margin-top: 3px; }
  .pl-class-btn .cls-count { font-size: 11px; color: #F59E0B; font-weight: 600; margin-top: 2px; }

  /* PL 학생 목록 */
  .pl-student-list { display: flex; flex-direction: column; gap: 8px; }
  .pl-student-row {
    background: var(--surface); border: 1.5px solid var(--border); border-radius: 10px;
    padding: 12px 16px; display: flex; align-items: center; gap: 12px; cursor: pointer; transition: all 0.15s;
  }
  .pl-student-row:hover { border-color: #F59E0B; background: #FFF8E6; }
  .pl-student-row.active { border-color: #F59E0B; background: #FFF8E6; }
  .pl-student-row.sent { background: #F0FFF4; border-color: #10B981; }
  .pl-check { width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--border);
    display: flex; align-items: center; justify-content: center; font-size: 12px; flex-shrink:0; }
  .pl-check.done { background: #10B981; border-color: #10B981; color: #fff; }
  .pl-student-name { font-weight: 700; font-size: 14px; flex: 1; }
  .pl-student-meta { font-size: 11.5px; color: var(--text-secondary); }
  .pl-student-badges { display: flex; gap: 4px; flex-wrap: wrap; }
  .pl-badge { font-size: 10.5px; background: #FFF3E0; color: #F59E0B; border: 1px solid #FDE68A;
    padding: 2px 7px; border-radius: 8px; font-weight: 600; }
  .pl-badge.course { background: var(--primary-light); color: var(--primary); border-color: #C7D2FE; }

  /* PL 문자 입력 패널 */
  .pl-layout { display: grid; grid-template-columns: 320px 1fr; gap: 20px; }
  @media (max-width: 900px) { .pl-layout { grid-template-columns: 1fr; } }

  .pl-result-box {
    background: var(--surface2); border: 1.5px solid var(--border); border-radius: 8px;
    padding: 14px; font-size: 13.5px; line-height: 1.75; white-space: pre-wrap;
    word-break: break-all; min-height: 180px; max-height: 380px; overflow-y: auto;
  }

  /* PL 학생 명단 */
  .pl-roster-table { width: 100%; border-collapse: collapse; font-size: 13px; }
  .pl-roster-table th { background: var(--surface2); padding: 9px 12px; text-align:left;
    font-size: 11.5px; color: var(--text-secondary); border-bottom: 1.5px solid var(--border); }
  .pl-roster-table td { padding: 10px 12px; border-bottom: 1px solid var(--border); vertical-align: top; }
  .pl-roster-table tr:hover td { background: #FFF8E6; }
  .pl-roster-table tr.clickable { cursor: pointer; }

  /* 오렌지 계열 버튼 */
  .btn-pl { background: #F59E0B; color: #fff; }
  .btn-pl:hover { background: #D97706; transform: translateY(-1px); }
  .btn-pl-outline { background: var(--surface); color: #F59E0B; border: 1.5px solid #F59E0B; }

<script type="module">
/* ===========================================================
   Firebase Firestore 실시간 연동 버전
   - localStorage 완전 제거 → Firestore 저장/실시간 동기화
   - 문서 구조: /bloomath/{docId} → {quarters: [...]}
=========================================================== */

import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
import {
  getFirestore, doc, setDoc, onSnapshot
} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';

const firebaseConfig = {
  apiKey: "AIzaSyB5kXJJ4pQtU5i6sqE3RXOUu2DiHRg87WA",
  authDomain: "bloomath-message.firebaseapp.com",
  projectId: "bloomath-message",
  storageBucket: "bloomath-message.firebasestorage.app",
  messagingSenderId: "968918734392",
  appId: "1:968918734392:web:2bc5c4df537eaaf64bb8cd"
};

const firebaseApp = initializeApp(firebaseConfig);
const firestore = getFirestore(firebaseApp);
const DB_DOC  = doc(firestore, 'bloomath', 'main');   // Bloomath 반별수업
const PL_DOC  = doc(firestore, 'bloomath', 'pl');     // PL 개별진도반

const CLASS_OPTIONS = ['MM4-2기본','MM4-1심화','MM4-1기본','MM3-2기본','MM3-1기본','MM3-2심화','MM3-1심화'];

// 반 이름 → 표시 순서
const CLASS_ORDER = {'MM4-2기본':0,'MM4-1심화':1,'MM4-1기본':2,'MM3-2기본':3,'MM3-1기본':4,'MM3-2심화':5,'MM3-1심화':6};

let db = { quarters: [] };
let view = { page: 'home', quarterId: null, classId: null };
let currentStudentIdx = 0;
let studentMgmtOpen = false;
let isSaving = false;  // 자기 자신의 저장 중엔 snapshot 무시
let isInitialized = false;

/* ===========================================================
   FIRESTORE 저장 / 실시간 수신
=========================================================== */

async function saveDB() {
  isSaving = true;
  try {
    await setDoc(DB_DOC, { quarters: db.quarters });
    flashSaveIndicator('saved');
  } catch(e) {
    console.error('저장 오류:', e);
    flashSaveIndicator('error');
  }
  setTimeout(() => { isSaving = false; }, 800);
}

function startRealtimeSync() {
  onSnapshot(DB_DOC, (snap) => {
    if (isSaving) return;  // 내가 저장한 직후 반영은 무시
    if (snap.exists()) {
      const remote = snap.data();
      db = { quarters: remote.quarters || [] };
    } else {
      db = { quarters: [] };
    }
    if (!isInitialized) {
      isInitialized = true;
      hideLoading();
      view = { page: 'main' };
      render();
    } else {
      // 다른 사람이 수정했을 때 현재 페이지만 부드럽게 갱신
      silentRefresh();
    }
  }, (err) => {
    console.error('실시간 동기화 오류:', err);
    showToast('⚠️ 동기화 오류: ' + err.message);
  });
}

function silentRefresh() {
  // 현재 페이지 상태를 유지하면서 데이터만 갱신
  if (view.page === 'home') {
    document.getElementById('app').innerHTML = renderHome();
    showSyncBadge();
  } else if (view.page === 'quarter') {
    document.getElementById('app').innerHTML = renderQuarterPage();
    showSyncBadge();
  } else if (view.page === 'class') {
    // 입력 중인 필드 값 보존
    const dateVal = document.getElementById('date')?.value;
    const progressVal = document.getElementById('progress')?.value;
    const homeworkVal = document.getElementById('homework')?.value;
    const commentVal = document.getElementById('comment')?.value;

    // 명단/목록 영역만 갱신 (입력 필드는 그대로)
    const c = getClass(view.quarterId, view.classId);
    if (c) {
      renderRosterList();
      renderTabs();
      renderMessageList();
      showSyncBadge();
    }
  }
}

function showSyncBadge() {
  const el = document.querySelector('.save-indicator');
  if (!el) return;
  el.innerHTML = '<span class="dot" style="background:var(--primary)"></span>다른 사용자가 업데이트했습니다';
  setTimeout(() => {
    el.innerHTML = '<span class="dot"></span>자동 저장됨';
  }, 3000);
}

function flashSaveIndicator(state) {
  const el = document.querySelector('.save-indicator');
  if (!el) return;
  if (state === 'saved') {
    el.innerHTML = '<span class="dot"></span>저장됨';
    el.style.color = 'var(--success)';
    setTimeout(() => {
      el.innerHTML = '<span class="dot"></span>자동 저장됨';
      el.style.color = 'var(--text-secondary)';
    }, 1000);
  } else if (state === 'saving') {
    el.innerHTML = '<span class="dot" style="background:#f59e0b"></span>저장 중...';
  } else if (state === 'error') {
    el.innerHTML = '<span class="dot" style="background:#ef4444"></span>저장 실패';
    el.style.color = '#ef4444';
  }
}

function hideLoading() {
  const el = document.getElementById('loadingScreen');
  if (el) el.style.display = 'none';
  const app = document.getElementById('app');
  if (app) app.style.display = '';
}

function uid() { return 'id_' + Math.random().toString(36).slice(2,10); }

function getQuarter(qid) { return db.quarters.find(q => q.id === qid); }
function getClass(qid, cid) {
  const q = getQuarter(qid);
  if (!q) return null;
  return q.classes.find(c => c.id === cid);
}

/* ===========================================================
   ROUTER / RENDER
=========================================================== */

function render() {
  if (!view || !view.page) return;
  renderBreadcrumb();
  const app = document.getElementById('app');
  if (!app) return;

  // 헤더 버튼 가시성 제어
  const statsBtn = document.getElementById('statsBtn');
  const plRosterBtn = document.getElementById('plRosterBtn');
  const isBloomath = ['home','quarter','class'].includes(view.page);
  const isPL = view.page && view.page.startsWith('pl');
  if (statsBtn) statsBtn.style.display = isBloomath ? '' : 'none';
  if (plRosterBtn) plRosterBtn.style.display = isPL ? '' : 'none';

  if (view.page === 'main') app.innerHTML = renderMainHub();
  else if (view.page === 'home') app.innerHTML = renderHome();
  else if (view.page === 'quarter') app.innerHTML = renderQuarterPage();
  else if (view.page === 'class') { app.innerHTML = renderClassPage(); initClassPage(); }
  else if (view.page === 'pl-home') app.innerHTML = renderPLHome();
  else if (view.page === 'pl-terms') app.innerHTML = renderPLTerms();
  else if (view.page === 'pl-class') { app.innerHTML = renderPLClassPage(); initPLClassPage(); }
  else if (view.page === 'pl-roster') app.innerHTML = renderPLRoster();
  else if (view.page === 'pl-student') app.innerHTML = renderPLStudentPage();
}

function renderBreadcrumb() {
  const bc = document.getElementById('breadcrumb');
  let html = `<span class="crumb" onclick="window._go('main')">🏠 홈</span>`;

  if (['home','quarter','class'].includes(view.page)) {
    html += `<span class="sep">›</span><span class="crumb" onclick="window._go('home')">MATHMILE</span>`;
    if (view.page === 'quarter' || view.page === 'class') {
      const q = getQuarter(view.quarterId);
      html += `<span class="sep">›</span>`;
      if (view.page === 'quarter') html += `<span class="current">${q ? q.name : ''}</span>`;
      else html += `<span class="crumb" onclick="window._go('quarter','${view.quarterId}')">${q ? q.name : ''}</span>`;
    }
    if (view.page === 'class') {
      const c = getClass(view.quarterId, view.classId);
      html += `<span class="sep">›</span><span class="current">${c ? c.name : ''}</span>`;
    }
  } else if (view.page.startsWith('pl')) {
    html += `<span class="sep">›</span><span class="crumb" onclick="window.plGo('home')">PL 개별진도반</span>`;
    if (view.page === 'pl-terms') {
      const t = getPLTerm(view.plTermId);
      html += `<span class="sep">›</span><span class="current">${t ? t.name : ''}</span>`;
    } else if (view.page === 'pl-class') {
      const t = getPLTerm(view.plTermId);
      const cls = getPLClassDef(view.plTermId, view.plClassId);
      if (t) html += `<span class="sep">›</span><span class="crumb" onclick="window.plGo('terms','${view.plTermId}')">${t.name}</span>`;
      html += `<span class="sep">›</span><span class="current">${cls ? cls.name : ''}</span>`;
    } else if (view.page === 'pl-roster') {
      html += `<span class="sep">›</span><span class="current">전체 학생 명단</span>`;
    } else if (view.page === 'pl-student') {
      html += `<span class="sep">›</span><span class="current">${view.plStudentName || ''}</span>`;
    }
  }
  bc.innerHTML = html;
}

window._go = function(page, qid, cid) {
  if (page === 'main') { view = { page:'main' }; render(); }
  else if (page === 'home') { view = { page:'home', quarterId:null, classId:null }; render(); }
  else if (page === 'quarter') { view = { page:'quarter', quarterId:qid, classId:null }; render(); }
  else if (page === 'class') { view = { page:'class', quarterId:qid, classId:cid }; currentStudentIdx = 0; studentMgmtOpen = false; render(); }
};

window.goHome = () => window._go('main');
window.goQuarter = (qid) => window._go('quarter', qid);
window.goClass = (qid, cid) => window._go('class', qid, cid);

/* ===========================================================
   HOME PAGE
=========================================================== */

function renderHome() {
  const now = new Date();
  const currentYear = now.getFullYear();
  const months = ['1월','2월','3월','4월','5월','6월','7월','8월','9월','10월','11월','12월'];
  const currentMonthIdx = now.getMonth(); // 0-indexed

  // 최신 분기가 위로 (추가된 역순)
  const boxes = [...db.quarters].reverse().map(q => `
    <div class="entity-box" onclick="window._go('quarter','${q.id}')">
      <button class="del-btn" onclick="event.stopPropagation(); window.deleteQuarter('${q.id}')">✕</button>
      <div class="emoji">🗂️</div>
      <div class="name">${q.name}</div>
      <div class="meta">${q.classes.length}개 반</div>
    </div>
  `).join('');

  return `
    <div class="page-title-row">
      <div>
        <button class="btn btn-outline btn-sm" onclick="window._go('main')" style="margin-bottom:8px;">← 홈으로</button>
        <div class="page-title">분기 관리</div>
        <div class="page-subtitle">분기를 생성하고 클릭하여 반을 관리하세요</div>
      </div>
    </div>
    <div class="toolbar">
      <label>연도</label>
      <select id="yearSelect" style="min-width:90px;">
        <option value="${currentYear-1}">${currentYear-1}년</option>
        <option value="${currentYear}" selected>${currentYear}년</option>
        <option value="${currentYear+1}">${currentYear+1}년</option>
      </select>
      <label>월 선택</label>
      <select id="monthSelect">
        ${months.map((m,i) => `<option value="${m}" ${i===currentMonthIdx?'selected':''}>${m}</option>`).join('')}
      </select>
      <button class="btn btn-primary" onclick="window.createQuarter()">➕ 분기생성</button>
    </div>
    <div class="box-grid">
      ${boxes}
    </div>
    ${db.quarters.length === 0 ? `<div class="empty-state"><div class="big-emoji">🗂️</div>연도와 월을 선택하고 '분기생성' 버튼을 눌러보세요</div>` : ''}
  `;
}

window.createQuarter = async function() {
  const year = document.getElementById('yearSelect').value;
  const month = document.getElementById('monthSelect').value;
  const name = `${year}년 ${month}분기`;
  if (db.quarters.find(q => q.name === name)) { showToast('⚠️ 이미 존재하는 분기입니다'); return; }
  db.quarters.push({ id: uid(), name, classes: [] });
  await saveDB();
  render();
  showToast(`✅ '${name}' 생성 완료`, 'success');
};

window.deleteQuarter = function(qid) {
  const q = getQuarter(qid);
  showConfirm(`'${q ? q.name : ''}' 분기와 모든 반/학생 데이터가 삭제됩니다.
정말 삭제할까요?`, async () => {
    db.quarters = db.quarters.filter(x => x.id !== qid);
    await saveDB();
    render();
    showToast('🗑️ 삭제되었습니다');
  });
};

/* ===========================================================
   QUARTER PAGE
=========================================================== */

function renderQuarterPage() {
  const q = getQuarter(view.quarterId);
  if (!q) return `<div class="empty-state">분기를 찾을 수 없습니다</div>`;

  // 1번: CLASS_ORDER 순서로 정렬
  const sortedClasses = [...q.classes].sort((a,b) => {
    const oa = CLASS_ORDER[a.name] ?? 99;
    const ob = CLASS_ORDER[b.name] ?? 99;
    return oa - ob;
  });

  // 2번: 반 카드에 요일 표시
  const boxes = sortedClasses.map(c => {
    const totalMsgs = (c.messages || []).length;
    const dayBadge = c.day ? `<div style="font-size:11px;color:#6366F1;font-weight:700;margin-bottom:3px;">${c.day}요일</div>` : '';
    return `
    <div class="entity-box" onclick="window._go('class','${q.id}','${c.id}')">
      <button class="del-btn" onclick="event.stopPropagation(); window.deleteClass('${q.id}','${c.id}')">✕</button>
      <button onclick="event.stopPropagation(); window.editClassInfo('${q.id}','${c.id}')" style="position:absolute;top:10px;right:36px;background:none;border:none;cursor:pointer;font-size:14px;color:#6B7280;" title="반 정보 수정">✏️</button>
      <div class="emoji">📘</div>
      <div class="name">${c.name}</div>
      ${dayBadge}
      <div class="meta" style="margin-bottom:6px;">학생 ${c.students.length}명 · 발송 ${totalMsgs}건</div>
      ${c.teacher ? `<span class="teacher-badge">👩‍🏫 ${escapeHtml(c.teacher)}</span>` : `<span style="font-size:11px;color:#D1D5DB;">담임 미지정</span>`}
    </div>
  `;
  }).join('');

  // 3번: 세련된 반별 학생 명단 테이블
  const activeClasses = sortedClasses.filter(c => c.students.length > 0);
  const maxStudents = activeClasses.length > 0 ? Math.max(...activeClasses.map(c => c.students.length)) : 0;

  const rosterTable = activeClasses.length === 0 ? '' : `
    <div class="card" style="margin-top:24px;">
      <div class="card-header" style="justify-content:space-between;">
        <div style="display:flex;align-items:center;gap:8px;">
          <div class="card-icon icon-students">👥</div>
          <div><div class="card-title">반별 학생 명단</div><div class="card-subtitle">학생명 클릭 시 문자 입력 화면으로 이동</div></div>
        </div>
      </div>
      <div class="card-body" style="padding:0;overflow-x:auto;">
        <table style="border-collapse:collapse;font-size:13.5px;table-layout:auto;min-width:100%;">
          <thead>
            <!-- 반이름 행 -->
            <tr>
              ${activeClasses.map(c => `
                <td style="padding:9px 14px;text-align:center;background:#1E293B;color:#fff;font-weight:700;font-size:13px;white-space:nowrap;cursor:pointer;min-width:100px;"
                  onclick="window._go('class','${q.id}','${c.id}')">
                  ${escapeHtml(c.name)}

window.goToStudent = function(qid, cid, stuIdx) {
  currentStudentIdx = stuIdx;
  studentMgmtOpen = false;
  view = { page:'class', quarterId:qid, classId:cid };
  render();
};

window.createClass = async function() {
  const name = document.getElementById('classNameSelect').value;
  const copyFrom = document.getElementById('copyFromSelect').value;
  const q = getQuarter(view.quarterId);
  const exists = q.classes.find(c => c.name === name);
  if (exists) { showToast('⚠️ 이미 생성된 반입니다'); window._go('class', q.id, exists.id); return; }

  // 전분기 학생 복사 처리
  let copiedStudents = [];
  if (copyFrom) {
    const [srcQid, srcCid] = copyFrom.split('__');
    const srcClass = getClass(srcQid, srcCid);
    if (srcClass && srcClass.students.length > 0) {
      // 이름/학교/학년만 복사, 수업1·수업2·comment는 초기화
      copiedStudents = srcClass.students.filter(s => s.name).map(s => ({
        id: uid(), name: s.name, school: s.school||'', grade: s.grade||'',
        class1: '', class2: '', comment: ''
      }));
    }
  }

  q.classes.push({
    id: uid(), name, date:'', progress:'', homework:'', teacher:'',
    students: copiedStudents, messages:[]
  });
  await saveDB();
  render();
  const msg = copiedStudents.length > 0
    ? `✅ '${name}' 생성 완료 (학생 ${copiedStudents.length}명 복사됨)`
    : `✅ '${name}' 생성 완료`;
  showToast(msg, 'success');
};

window.eciRemoveStudent = async function(qid, cid, idx, btn) {
  const q = getQuarter(qid);
  const c = q ? q.classes.find(x=>x.id===cid) : null;
  if (!c) return;
  const s = c.students[idx];
  if (!confirm(`'${s.name}' 학생을 명단에서 삭제할까요?`)) return;
  c.students.splice(idx, 1);
  await saveDB();
  // 목록 새로고침
  const list = document.getElementById('eciStudentList');
  if (list) {
    list.innerHTML = c.students.length === 0 ? '<div style="color:var(--text-secondary);font-size:13px;padding:8px;">등록된 학생이 없습니다.</div>' :
      c.students.map((s,i)=>`<div style="display:flex;align-items:center;justify-content:space-between;padding:6px 8px;border-radius:6px;background:var(--surface2);margin-bottom:4px;">
        <span style="font-size:13px;font-weight:500;">${escapeHtml(s.name)} <span style="color:var(--text-secondary);font-weight:400;">${escapeHtml(s.school||'')} ${escapeHtml(s.grade||'')}</span></span>
        <button class="btn btn-danger btn-sm" onclick="window.eciRemoveStudent('${qid}','${cid}',${i},this)">삭제</button>
      </div>`).join('');
  }
  showToast('🗑️ 삭제되었습니다');
};

window.saveClassInfo = async function(qid, cid) {
  const q = getQuarter(qid);
  const c = q ? q.classes.find(x=>x.id===cid) : null;
  if (!c) return;
  c.name    = document.getElementById('eciName').value.trim() || c.name;
  c.day     = document.getElementById('eciDay').value.trim();
  c.teacher = document.getElementById('eciTeacher').value.trim();
  c.textbooks = [
    document.getElementById('eciTb0').value.trim(),
    document.getElementById('eciTb1').value.trim(),
    document.getElementById('eciTb2').value.trim(),
  ].filter(Boolean);
  await saveDB();
  window.closeModal();
  render();
  showToast('✅ 반 정보가 저장되었습니다', 'success');
};

// oninput에서 전역 접근 가능하도록 window에 등록
window._onCommonInput = function() { onCommonInput(); };

function initClassPage() {
  const c = getClass(view.quarterId, view.classId);
  if (!c) return;
  document.getElementById('date').value = c.date || '';

  // 교재별 진도/과제 렌더링
  renderTextbookProgressWrap(c);

  // 일일TEST
  const testData = c.testData || {};
  document.getElementById('testCourse').value = testData.course || '';
  document.getElementById('testUnit').value = testData.unit || '';
  document.getElementById('testScore').value = testData.score || '';
  document.getElementById('testMax').value = testData.max || '';

  document.getElementById('date').oninput = window._onCommonInput;
  document.getElementById('testCourse').oninput = window._onCommonInput;
  document.getElementById('testUnit').oninput = window._onCommonInput;
  document.getElementById('testScore').oninput = window._onCommonInput;
  document.getElementById('testMax').oninput = window._onCommonInput;
  document.getElementById('comment').oninput = () => { onStudentInput(); countChars(); };

  if (currentStudentIdx >= c.students.length) currentStudentIdx = 0;
  renderRosterList();
  renderTabs();
  loadCurrentStudentFields();

}

window.toggleMsgList = function() {
  const body = document.getElementById('msgListBody');
  const icon = document.getElementById('msgListToggleIcon');
  if (!body) return;
  const open = body.style.display === 'none';
  body.style.display = open ? '' : 'none';
  if (icon) icon.textContent = open ? '▲' : '▼';
};

function onCommonInput() {
  const c = getClass(view.quarterId, view.classId);
  c.date = document.getElementById('date').value;

  // 교재별 진도/과제 저장
  const tbs = (c.textbooks && c.textbooks.length > 0) ? c.textbooks : [''];
  c.tbProgress = {};
  c.tbHomework = {};
  tbs.forEach((_, i) => {
    const p = document.getElementById(`tbProgress_${i}`);
    const h = document.getElementById(`tbHomework_${i}`);
    if (p) c.tbProgress[i] = p.value;
    if (h) c.tbHomework[i] = h.value;
  });

  // 일일TEST 저장
  c.testData = {
    course: (document.getElementById('testCourse')||{}).value || '',
    unit:   (document.getElementById('testUnit')||{}).value || '',
    score:  (document.getElementById('testScore')||{}).value || '',
    max:    (document.getElementById('testMax')||{}).value || '',
  };

  // 하위 호환 (기존 progress/homework 필드도 유지)
  c.progress = Object.values(c.tbProgress).filter(Boolean).join(' / ');
  c.homework = Object.values(c.tbHomework).filter(Boolean).join(' / ');

  saveDB();
  generateSingle();
}

function onStudentInput() {
  const c = getClass(view.quarterId, view.classId);
  if (c.students.length === 0) return;
  const s = c.students[currentStudentIdx];
  s.comment = document.getElementById('comment').value;
  saveDB();
  generateSingle();
}

    const c = getClass(view.quarterId, view.classId);
    c.date = ''; c.progress = ''; c.homework = '';
    c.tbProgress = {}; c.tbHomework = {};
    c.testData = { course:'', unit:'', score:'', max:'' };

    document.getElementById('date').value = '';
    ['testCourse','testUnit','testScore','testMax'].forEach(id => {
      const el = document.getElementById(id); if(el) el.value = '';

function renderTabs() {

/* 문자 생성 (교재별 진도/과제 + 일일TEST 포함) */
function buildMessage(date, progress, homework, studentName, comment, classObj) {
  const name = studentName || '학생';
  let msg = '';
  if (date) msg += `${date} 진도 및 과제 안내\n\n`;

  // 교재별 진도/과제 (classObj가 있을 때 우선 사용)
  if (classObj && classObj.textbooks && classObj.textbooks.length > 0) {
    const tbs = classObj.textbooks;
    const tbP = classObj.tbProgress || {};
    const tbH = classObj.tbHomework || {};
    // 진도 블록
    const progressLines = tbs.map((tb,i) => tbP[i] ? `[${tb}] ${tbP[i]}` : '').filter(Boolean);
    if (progressLines.length > 0) {
      msg += `■ 진도\n${progressLines.join('\n')}\n\n`;
    }
    // 과제 블록
    const homeworkLines = tbs.map((tb,i) => tbH[i] ? `[${tb}] ${tbH[i]}` : '').filter(Boolean);
    if (homeworkLines.length > 0) {
      msg += `■ 과제\n${homeworkLines.join('\n')}\n\n`;
    }
  } else {
    if (progress) msg += `■ 진도\n${progress}\n\n`;
    if (homework) msg += `■ 과제\n${homework}\n\n`;
  }

  // 일일TEST
  if (classObj && classObj.testData) {
    const t = classObj.testData;
    if (t.course || t.unit || t.score) {
      msg += `■ 일일TEST\n`;
      const parts = [];
      if (t.course) parts.push(t.course);
      if (t.unit) parts.push(t.unit);
      if (t.score) parts.push(`${t.score}점`);
      if (t.max) parts.push(`${t.max}점 만점`);
      msg += parts.join(' / ') + '\n\n';
    }
  }

  msg += `오늘 ${name}학생의 MATHMILE는? \n`;
  if (comment) msg += comment;
  return msg.trim();
}

function generateSingle() {
  const c = getClass(view.quarterId, view.classId);
  const box = document.getElementById('singleResult');
  if (!box) return;
  if (c.students.length === 0) {
    box.innerHTML = '<span class="result-placeholder">학생 명단을 먼저 추가해주세요.</span>';
    return;
  }
  const s = c.students[currentStudentIdx];
  const msg = buildMessage(c.date, c.progress, c.homework, s.name, s.comment, c);
  const hasContent = c.date || c.progress || c.homework || s.name || s.comment ||
    (c.testData && (c.testData.course || c.testData.score)) ||
    (c.tbProgress && Object.values(c.tbProgress).some(Boolean));
  if (!hasContent) {
    box.innerHTML = '<span class="result-placeholder">왼쪽에서 내용을 입력하면 자동으로 문자가 생성됩니다.</span>';
  } else {
    box.textContent = msg;
    box.classList.remove('updated'); void box.offsetWidth; box.classList.add('updated');
  }
}

function countChars() {
  const v = document.getElementById('comment')?.value || '';
  const el = document.getElementById('charCount');
  if (!el) return;
  el.textContent = `${v.length}자`;

}

window.saveCurrentMessage = async function() {
  const c = getClass(view.quarterId, view.classId);
  if (c.students.length === 0) { showToast('⚠️ 학생 명단을 먼저 추가해주세요'); return; }
  const s = c.students[currentStudentIdx];
  const msg = buildMessage(c.date, c.progress, c.homework, s.name, s.comment, c);
  if (!c.date || !s.name) { showToast('⚠️ 날짜와 학생 이름을 입력해주세요'); return; }
  if (!c.messages) c.messages = [];
  const existing = c.messages.find(m => m.date === c.date && m.studentId === s.id);
  const entry = { id: existing?existing.id:uid(), date:c.date, progress:c.progress, homework:c.homework, studentId:s.id, studentName:s.name, comment:s.comment, text:msg, createdAt:existing?existing.createdAt:Date.now() };
  if (existing) Object.assign(existing, entry); else c.messages.push(entry);
  await saveDB();
  renderMessageList();
  showToast('💾 발송목록에 저장되었습니다', 'success');
};

function renderStats() {
  const content = document.getElementById('statsContent');
  let totalClasses=0, totalStudents=0, totalMessages=0;
  db.quarters.forEach(q => {
    totalClasses += q.classes.length;
    q.classes.forEach(c => { totalStudents += c.students.filter(s=>s.name).length; totalMessages += (c.messages||[]).length; });
  });
  let html = `
    <div class="stat-summary">
      <div class="stat-card"><div class="num">${db.quarters.length}</div><div class="lbl">전체 분기</div></div>
      <div class="stat-card"><div class="num">${totalClasses}</div><div class="lbl">전체 반</div></div>
      <div class="stat-card"><div class="num">${totalStudents}</div><div class="lbl">전체 학생</div></div>
      <div class="stat-card"><div class="num">${totalMessages}</div><div class="lbl">전체 발송 문자</div></div>
    </div>
  `;
  if (db.quarters.length === 0) { html += `<div class="empty-state"><div class="big-emoji">📊</div>아직 데이터가 없습니다</div>`; content.innerHTML = html; return; }

  // 최신 분기가 위로
  const sortedQuarters = [...db.quarters].reverse();

  sortedQuarters.forEach(q => {
    const qMsgCount = q.classes.reduce((s,c)=>s+(c.messages||[]).length,0);
    const qKey = q.id;
    html += `<div class="stat-section">
      <div class="stat-section-header" style="display:flex;align-items:center;justify-content:space-between;">
        <span>🗂️ ${escapeHtml(q.name)} <span class="count">· 발송 ${qMsgCount}건</span></span>
        <div style="display:flex;gap:6px;">
          <button class="btn btn-outline btn-sm" style="font-size:11px;padding:3px 10px;" onclick="window.expandAllStats('${qKey}')">전체 펼치기</button>
          <button class="btn btn-outline btn-sm" style="font-size:11px;padding:3px 10px;" onclick="window.collapseAllStats('${qKey}')">전체 접기</button>
        </div>
      </div>
      <div class="stat-section-body" id="statbody_${qKey}">`;

    if (q.classes.length === 0) {
      html += `<div class="stat-row"><span class="sub-text">등록된 반이 없습니다</span></div>`;
    } else {
      q.classes.forEach(c => {
        const msgs = c.messages || [];
        const totalClassMsgs = msgs.length;

        // 학생별로 발송 내역 묶기
        const studentMap = {};
        c.students.forEach(s => { if (s.name) studentMap[s.id] = { name: s.name, msgs: [] }; });
        msgs.forEach(m => {
          if (studentMap[m.studentId]) {
            studentMap[m.studentId].msgs.push(m);
          } else {
            // studentId 없는 경우 이름으로 매핑
            const found = Object.values(studentMap).find(x => x.name === m.studentName);
            if (found) found.msgs.push(m);
            else {
              if (!studentMap['_'+m.studentName]) studentMap['_'+m.studentName] = { name: m.studentName, msgs: [] };
              studentMap['_'+m.studentName].msgs.push(m);
            }
          }
        });

        const studentList = Object.values(studentMap).filter(x => x.name);

        html += `
          <div class="stat-row" onclick="window.toggleClassStats('${q.id}_${c.id}')" style="border-bottom:1.5px solid var(--border);">
            <div class="left">
              <span class="badge">📘 ${escapeHtml(c.name)}</span>
              ${c.teacher ? `<span class="teacher-badge" style="margin-left:4px;">👩‍🏫 ${escapeHtml(c.teacher)}</span>` : ''}
              <span class="sub-text">학생 ${studentList.length}명</span>
            </div>
            <span class="count">${totalClassMsgs}건 ▾</span>
          </div>
          <div id="classstats_${q.id}_${c.id}" data-qid="${q.id}" style="display:none;">
        `;

        if (studentList.length === 0) {
          html += `<div style="padding:12px 20px;color:var(--text-secondary);font-size:13px;">저장된 발송 내역이 없습니다</div>`;
        } else {
          // 반 전체 기준 날짜 목록 (모든 학생 발송 날짜 합집합, 정렬)
          const parseDate = d => {
            const m = (d||'').match(/(\d{1,2})[\/\.](\d{1,2})/);
            return m ? parseInt(m[1])*100 + parseInt(m[2]) : 0;
          };
          const allDatesSet = new Set();
          studentList.forEach(stu => stu.msgs.forEach(m => { if(m.date) allDatesSet.add(m.date); }));
          const allDates = [...allDatesSet].sort((a,b) => parseDate(a) - parseDate(b));

          html += `<table style="width:100%;border-collapse:collapse;font-size:13px;">
            <thead>
              <tr style="background:var(--surface2);">
                <th style="padding:9px 16px;text-align:center;width:60px;font-size:11.5px;color:var(--text-secondary);letter-spacing:0.03em;border-bottom:1px solid var(--border);">발송수</th>
                <th style="padding:9px 12px;text-align:left;width:90px;font-size:11.5px;color:var(--text-secondary);letter-spacing:0.03em;border-bottom:1px solid var(--border);">학생</th>
                <th style="padding:9px 12px;text-align:left;font-size:11.5px;color:var(--text-secondary);letter-spacing:0.03em;border-bottom:1px solid var(--border);">발송 날짜</th>
              </tr>
            </thead>
            <tbody>`;

          studentList.forEach(stu => {
            const stuMsgs = stu.msgs.slice().sort((a,b) => parseDate(a.date) - parseDate(b.date));
            const count = stuMsgs.length;
            // 이 학생이 발송한 날짜 Set
            const stuDates = new Set(stuMsgs.map(m => m.date));
            // 학생별 첫 발송일 (이전 날짜는 신입생 처리)
            const firstDate = stuMsgs.length > 0 ? parseDate(stuMsgs[0].date) : null;
            // 날짜별 msg id 맵
            const dateToMsg = {};
            stuMsgs.forEach(m => { dateToMsg[m.date] = m; });

            html += `
              <tr style="border-bottom:1px solid var(--border);vertical-align:middle;">
                <td style="padding:10px 16px;text-align:center;">
                  <span style="display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:50%;background:${count>0?'var(--primary)':'var(--border)'};color:${count>0?'#fff':'var(--text-secondary)'};font-size:12px;font-weight:700;">${count}</span>
                </td>
                <td style="padding:10px 12px;font-weight:700;white-space:nowrap;">${escapeHtml(stu.name)}</td>
                <td style="padding:10px 12px;">
                  <div style="display:flex;flex-wrap:wrap;gap:5px;">
                    ${allDates.map(date => {
                      const dateParsed = parseDate(date);
                      const msg = dateToMsg[date];

                      if (msg) {
                        // 🟢 발송됨 - 녹색 (클릭 가능)
                        return `<span
                          onclick="window.viewStatsMessage('${q.id}','${c.id}','${msg.id}')"
                          style="display:inline-flex;align-items:center;background:var(--success-light);color:var(--success);border:1px solid #A7F3D0;padding:3px 9px;border-radius:12px;font-size:12px;font-weight:600;cursor:pointer;transition:all 0.15s;white-space:nowrap;"
                          onmouseover="this.style.background='var(--success)';this.style.color='#fff';"
                          onmouseout="this.style.background='var(--success-light)';this.style.color='var(--success)';"
                        >${escapeHtml(date)}</span>`;
                      } else if (firstDate === null || dateParsed < firstDate) {
                        // ⬜ 첫 발송일 이전 (신입생) - 날짜를 배경색과 같은 색으로 안 보이게
                        return `<span style="display:inline-flex;align-items:center;background:#F1F5F9;color:#F1F5F9;border:1px solid #F1F5F9;padding:3px 9px;border-radius:12px;font-size:12px;font-weight:600;white-space:nowrap;user-select:none;">${escapeHtml(date)}</span>`;
                      } else {
                        // ⬛ 미발송 - 날짜를 회색으로 표시
                        return `<span style="display:inline-flex;align-items:center;background:#F1F5F9;color:#94A3B8;border:1px solid #E2E8F0;padding:3px 9px;border-radius:12px;font-size:12px;font-weight:600;white-space:nowrap;">${escapeHtml(date)}</span>`;
                      }
                    }).join('')}
                  </div>
                </td>
              </tr>`;
          });

          html += `</tbody></table>`;
        }

        html += `</div>`;
      });
    }
    html += `</div></div>`;
  });

  content.innerHTML = html;
}

/* ===========================================================
   PL 개별진도반 - 데이터 모델 (분기 구조)
   pl_db = {
     terms: [ { id, name, venue, classes:[{id,name,day,time,teacher}] } ],
     classes: { classId: { students, sessions, currentDate } },
     students: { studentId: { name, school, grade, course, period, endMonth, memo, sentLog, history:[{id,classId,className,date,sessionNum,text,sentAt}] } }
   }
=========================================================== */

const PL_STORAGE_KEY = 'bloomath_pl_v1';
let pl_db = { terms: [], classes: {}, students: {} };
let plView = { termId: null, classId: null, studentId: null };
let isPLSaving = false;
let isPLInitialized = false;

function loadPLDB() { return { terms: [], classes: {}, students: {} }; }

async function savePLDB() {
  isPLSaving = true;
  try {
    await setDoc(PL_DOC, { terms: pl_db.terms, classes: pl_db.classes, students: pl_db.students });
    flashSaveIndicator('saved');
  } catch(e) {
    console.error('PL 저장 오류:', e);
    flashSaveIndicator('error');
  }
  setTimeout(() => { isPLSaving = false; }, 800);
}

/* 기존 sendHistory → student.history 마이그레이션 */
async function migratePLSendHistory() {
  let changed = false;
  Object.entries(pl_db.classes).forEach(([classId, data]) => {
    const legacy = data.sendHistory;
    if (!legacy || legacy.length === 0) return;
    // 반 이름 조회
    const clsDef = pl_db.terms.flatMap(t=>t.classes).find(c=>c.id===classId);
    const className = clsDef ? clsDef.name : classId;
    legacy.forEach(h => {
      const sid = h.studentId;
      if (!sid || !pl_db.students[sid]) return;
      if (!pl_db.students[sid].history) pl_db.students[sid].history = [];
      // 이미 있는지 확인 (중복 방지)
      const exists = pl_db.students[sid].history.some(x => x.id === h.id);
      if (!exists) {
        pl_db.students[sid].history.push({ ...h, classId, className });
        changed = true;
      }
    });
    // 마이그레이션 후 sendHistory 비우기
    data.sendHistory = [];
  });
  if (changed) {
    await savePLDB();
    console.log('PL sendHistory 마이그레이션 완료');
  }
}

function startPLRealtimeSync() {
  onSnapshot(PL_DOC, (snap) => {
    if (isPLSaving) return;
    if (snap.exists()) {
      const r = snap.data();
      pl_db = { terms: r.terms||[], classes: r.classes||{}, students: r.students||{} };
    } else {
      pl_db = { terms: [], classes: {}, students: {} };
      setDoc(PL_DOC, { terms:[], classes:{}, students:{} }).catch(e=>console.error(e));
    }
    if (!isPLInitialized) {
      isPLInitialized = true;
      // 기존 sendHistory → student.history 자동 마이그레이션
      migratePLSendHistory();
    } else if (view.page && view.page.startsWith('pl')) { silentPLRefresh(); }
  }, (err) => { console.error('PL 동기화 오류:', err); isPLInitialized = true; });
}

function silentPLRefresh() {
  const app = document.getElementById('app');
  if (!app) return;
  if (view.page === 'pl-home') { app.innerHTML = renderPLHome(); showSyncBadge(); }
  else if (view.page === 'pl-terms') { app.innerHTML = renderPLTerms(); showSyncBadge(); }
  else if (view.page === 'pl-class') { const t=document.getElementById('plStudentTabs'); if(t){renderPLStudentTabs();showSyncBadge();} }
  else if (view.page === 'pl-roster') { app.innerHTML = renderPLRoster(); showSyncBadge(); }
}

function getPLTerm(tid) { return pl_db.terms.find(t=>t.id===tid); }
function getPLClassDef(termId, classId) { const t=getPLTerm(termId); return t?t.classes.find(c=>c.id===classId):null; }
function getPLClassData(classId) {
  if (!pl_db.classes[classId]) pl_db.classes[classId]={students:[],sessions:[],currentDate:''};
  return pl_db.classes[classId];
}
function getPLClass(venue, classId) {
  for(const t of pl_db.terms){ const c=t.classes.find(x=>x.id===classId); if(c) return c; }
  return null;
}
function sortClassesByTime(classes) {
  return [...classes].sort((a,b)=>{
    const m=t=>{const r=(t||'').match(/(\d+):(\d+)/);return r?parseInt(r[1])*60+parseInt(r[2]):999;};
    return m(a.time)-m(b.time);
  });
}

window.createPLTerm = async function() {
  const yr=document.getElementById('plYearSel').value;
  const mo=document.getElementById('plMonthSel').value;
  const venue=document.getElementById('plVenueSel').value;
  const name=`${yr}년 ${mo}분기 (${venue})`;
  if(pl_db.terms.find(t=>t.name===name)){showToast('⚠️ 이미 존재하는 분기입니다');return;}
  // 영재관은 elementary+secondary 합산, 프리미엄관은 배열 그대로
  const def = PL_DEFAULT_CLASSES[venue];
  const rawClasses = Array.isArray(def) ? def : [...(def.elementary||[]), ...(def.secondary||[])];
  const defaultClasses = rawClasses.map(c => ({ id: uid(), name: c.name, day: c.day, time: c.time, teacher: '' }));
  pl_db.terms.push({id:uid(), name, venue, classes: defaultClasses});
  await savePLDB(); render(); showToast(`✅ '${name}' 생성 완료 (기본 반 ${defaultClasses.length}개 자동 추가)`,'success');
};
window.deletePLTerm=function(tid){
  const t=getPLTerm(tid);
  showConfirm(`'${t?.name}' 분기를 삭제할까요?`, async()=>{
    pl_db.terms=pl_db.terms.filter(x=>x.id!==tid);
    await savePLDB(); render(); showToast('🗑️ 삭제됨');
  });
};

/* PL 분기 상세 - 반 CRUD */
function renderPLTerms() {
  const termId=view.plTermId;
  const term=getPLTerm(termId);
  if(!term) return `<div class="empty-state">분기를 찾을 수 없습니다</div>`;
  const sorted=sortClassesByTime(term.classes);
  const dayOrder=['월','화','수','목','금','토','일'];
  const days=[...new Set(sorted.map(c=>c.day))].sort((a,b)=>dayOrder.indexOf(a)-dayOrder.indexOf(b));
  // 같은 관(venue)의 이전 분기들만 필터링 (최신순)
  const sameVenueTerms = pl_db.terms
    .filter(t => t.id !== termId && t.venue === term.venue)
    .slice()
    .reverse(); // 최신 분기가 먼저
  const prevTerm = sameVenueTerms.length > 0 ? sameVenueTerms[0] : null;

  // 월~목 요일만 학생명단 표 생성
  // 테이블 구성: 영재관은 초등/중등 2개, 프리미엄관은 1개
  let rosterTable = '';
  if (term.venue === '영재관') {
    // 영재관: 초등PL(월~금 1~2부)과 중등PL&주말 분리
    const isSecondary = cls =>
      cls.plType === 'secondary' ||
      (cls.plType !== 'elementary' && (
        ['토','일'].includes(cls.day) ||
        (cls.day === '수' && (cls.name === '수A' || cls.name === '수B' || cls.time.startsWith('5'))) ||
        (cls.day === '금' && cls.time.startsWith('7'))
      ));
    const elementaryCls = sortClassesByTime(term.classes.filter(c => !isSecondary(c)));
    const secondaryCls  = sortClassesByTime(term.classes.filter(c =>  isSecondary(c)));
    const elemTable = elementaryCls.length > 0 ? buildPLRosterTable(termId, term, elementaryCls, '초등PL 학생명단') : '';
    const secTable  = secondaryCls.length  > 0 ? buildPLRosterTable(termId, term, secondaryCls,  '중등PL & 주말단과 학생명단') : '';
    rosterTable = elemTable + secTable;
  } else {
    // 프리미엄관 등: 단일 테이블
    const allCls = sortClassesByTime(term.classes);
    rosterTable = allCls.length > 0 ? buildPLRosterTable(termId, term, allCls, '초중등PL 학생명단') : '';
  }

  return `
    <div class="page-title-row">
      <div>
        <button class="btn btn-outline btn-sm" onclick="window.plGo('home')" style="margin-bottom:8px;">← 분기 목록</button>
        <div class="page-title" style="color:#F59E0B;">${term.name}</div>
        <div class="page-subtitle">${term.venue} · 반을 선택하거나 추가하세요</div>
      </div>
    </div>
    <div class="toolbar" style="flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:20px;">
      ${term.venue === '영재관' ? `<label>구분</label><select id="plNewClassType" style="width:80px;"><option value="elementary">초등PL</option><option value="secondary">중등PL</option></select>` : ''}
      <label>반 이름</label><input type="text" id="plNewClassName" placeholder="예: 월1부A" style="width:100px;">
      <label>요일</label>
      <select id="plNewClassDay" style="width:70px;">${['월','화','수','목','금','토','일'].map(d=>`<option>${d}</option>`).join('')}</select>
      <label>시간</label><input type="text" id="plNewClassTime" placeholder="3:00~6:00" style="width:110px;">
      <button class="btn btn-pl btn-sm" onclick="window.addPLClass('${termId}')">➕ 반추가</button>
      ${sameVenueTerms.length > 0 ? `
        <div style="border-left:1px solid var(--border);padding-left:12px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;">
          <label style="white-space:nowrap;">전분기 명단 복사</label>
          <select id="plCopyFrom" style="width:200px;">
            <option value="">— 원본 반 선택 —</option>
            ${sameVenueTerms.flatMap(t => sortClassesByTime(t.classes).map(c => `<option value="${c.id}">${t.name} › ${c.name}</option>`)).join('')}
          </select>
          <select id="plCopyTo" style="width:120px;">
            <option value="">→ 대상 반</option>
            ${sorted.map(c=>`<option value="${c.id}">${c.name}</option>`).join('')}
          </select>
          <button class="btn btn-pl-outline btn-sm" onclick="window.copyPLStudents()">복사</button>
        </div>`:``}
    </div>

    <!-- 요일별 학생 명단 테이블 -->
    ${rosterTable}

    <!-- 반 박스 그리드 -->
    ${days.map(day=>{
      const dc=sorted.filter(c=>c.day===day);
      return `<div style="margin-bottom:20px;">
        <div style="font-size:12px;font-weight:700;color:var(--text-secondary);text-transform:uppercase;letter-spacing:0.06em;margin-bottom:8px;">${day}요일</div>
        <div class="pl-class-grid">
          ${dc.map(cls=>{
            const cnt=pl_db.classes[cls.id]?.students?.length||0;
            return `<div class="entity-box" style="cursor:pointer;" onclick="window.plGo('class','${termId}','${cls.id}')">
              <button class="del-btn" onclick="event.stopPropagation();window.deletePLClass('${termId}','${cls.id}')">✕</button>
              <div class="emoji">📘</div>
              <div class="name" style="font-size:14px;">${cls.name}</div>
              <div style="font-size:11px;color:var(--text-secondary);margin:3px 0;">${cls.time}</div>
              <div style="font-size:11px;color:#F59E0B;font-weight:600;">${cnt>0?`👤 ${cnt}명`:'학생 없음'}</div>
              ${cls.teacher?`<div style="font-size:10px;color:#9CA3AF;margin-top:2px;">👩‍🏫 ${cls.teacher}</div>`:''}
              <button class="btn btn-outline btn-sm" style="margin-top:8px;font-size:11px;padding:3px 8px;" onclick="event.stopPropagation();window.editPLClass('${termId}','${cls.id}')">✏️ 수정</button>
            </div>`;
          }).join('')}
        </div>
      </div>`;
    }).join('')}
    ${days.length===0?`<div class="empty-state"><div class="big-emoji">📘</div>위 폼에서 반을 추가해주세요</div>`:''}`;
}

/* 요일별 학생 명단 테이블 생성 */
function buildPLRosterTable(termId, term, clsList, tableTitle) {
  if (!clsList || clsList.length === 0) return '';
  const dayOrder=['월','화','수','목','금','토','일'];
  const days=[...new Set(clsList.map(c=>c.day))].sort((a,b)=>dayOrder.indexOf(a)-dayOrder.indexOf(b));
  const dayClsMap={};
  days.forEach(day=>{ dayClsMap[day]=clsList.filter(c=>c.day===day); });
  const allCols=[];
  days.forEach(day=>{ dayClsMap[day].forEach((cls,ci)=>{ allCols.push({day,cls,isFirstOfDay:ci===0}); }); });
  if(allCols.length===0) return '';
  const colStudents=allCols.map(({cls})=>{
    const d=pl_db.classes[cls.id];
    return (d?.students||[]).slice().sort((a,b)=>a.name.localeCompare(b.name,'ko'));
  });
  const maxRows=Math.max(...colStudents.map(s=>s.length),0);
  const dayColSpan={};
  days.forEach(day=>{ dayColSpan[day]=dayClsMap[day].length; });
  const BD='border-left:2.5px solid #64748B;';
  const CW='min-width:85px;width:85px;';

  // 요일 헤더 행
  let dayRow='', nameRow='', timeRow='', tchrRow='';
  days.forEach((day,di)=>{
    const bl=di>0?BD:'';
    dayRow+=`<td colspan="${dayClsMap[day].length}" style="${bl}${CW}padding:7px 4px;text-align:center;background:#1E293B;color:#fff;font-weight:800;font-size:13px;">${day}요일</td>`;
  });
  allCols.forEach(({day,cls,isFirstOfDay},ci)=>{
    const bl=(isFirstOfDay&&ci>0)?BD:'';
    const isB=cls.name.endsWith('B')||cls.name==='수B';
    const bg=isB?'#DC2626':'#475569';
    nameRow+=`<td style="${bl}${CW}padding:6px 3px;text-align:center;background:${bg};color:#fff;font-weight:700;font-size:12px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;" onclick="window.plGo('class','${termId}','${cls.id}')" title="${escapeHtml(cls.name)}">${escapeHtml(cls.name)}</td>`;
    timeRow+=`<td style="${bl}${CW}padding:3px 4px;text-align:center;background:#E2E8F0;font-size:11px;color:#475569;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${escapeHtml(cls.time)}</td>`;
    tchrRow+=`<td style="${bl}${CW}padding:3px 4px;text-align:center;background:#F8FAFC;font-size:11px;color:#64748B;font-weight:600;border-bottom:1.5px solid #CBD5E1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${cls.teacher||'-'}</td>`;
  });

  // 학생 행
  let stuRows='';
  for(let row=0; row<maxRows+2; row++){
    let cells='';
    allCols.forEach(({day,cls,isFirstOfDay},ci)=>{
      const bl=(isFirstOfDay&&ci>0)?BD:'';
      const stu=colStudents[ci][row];
      if(!stu){
        const bg=row>=colStudents[ci].length?'#FAFAFA':'transparent';
        cells+=`<td style="${bl}${CW}padding:6px 3px;border-top:1px solid #F1F5F9;background:${bg};"></td>`;
      } else {
        const stuInfo=pl_db.students[stu.id]||{};
        const grade=(stuInfo.grade||'').replace(/초|중|고/,'');
        const sn=escapeHtml(stu.name);
        cells+=`<td style="${bl}${CW}padding:6px 3px;border-top:1px solid #F1F5F9;text-align:center;">
          <span data-stuname="${sn}"
            onclick="window.goToPLStudent('${termId}','${cls.id}','${stu.id}')"
            onmouseenter="window.highlightPLStudent('${sn}',true)"
            onmouseleave="window.highlightPLStudent('${sn}',false)"
            style="cursor:pointer;font-weight:600;color:var(--primary);font-size:13.5px;white-space:nowrap;border-radius:4px;padding:2px 4px;transition:background 0.12s,color 0.12s;"
          >${sn}<sup style="font-size:9.5px;color:#94A3B8;">${grade}</sup></span>
        </td>`;
      }
    });
    stuRows+=`<tr>${cells}</tr>`;
  }

  return `<div class="card" style="margin-bottom:18px;">
    <div class="card-header" style="justify-content:space-between;">
      <div style="display:flex;align-items:center;gap:8px;">
        <div class="card-icon" style="background:#FFF3E0;">👥</div>
        <div><div class="card-title">${tableTitle}</div><div class="card-subtitle">이름 클릭 → 문자 입력 · 마우스 올리면 같은 학생 강조</div></div>
      </div>
    </div>
    <div class="card-body" style="padding:0;overflow-x:auto;">
      <table style="border-collapse:collapse;font-size:13.5px;table-layout:fixed;">
        <tr>${dayRow}</tr>
        <tr>${nameRow}</tr>
        <tr>${timeRow}</tr>
        <tr>${tchrRow}</tr>
        ${stuRows}
      </table>
    </div>
  </div>`;
}

/* 학생 명단 검색 - 일치 학생 강조, 나머지 흐리게 */
window.searchPLRoster = function(query) {
  const q = query.trim();
  const spans = document.querySelectorAll('#plRosterTable [data-stuname]');
  if (!q) {
    // 검색어 없으면 모두 원래대로
    spans.forEach(el => {
      el.style.background = '';
      el.style.color = 'var(--primary)';
      el.style.textDecoration = 'underline';
      el.style.fontWeight = '600';
      el.style.opacity = '';
      el.style.borderRadius = '';
    });
    return;
  }
  spans.forEach(el => {
    const name = el.getAttribute('data-stuname') || '';
    if (name.includes(q)) {
      // 검색 일치: 노란 배경 + 진한 글씨
      el.style.background = '#FBBF24';
      el.style.color = '#1E293B';
      el.style.textDecoration = 'none';
      el.style.fontWeight = '800';
      el.style.opacity = '1';
      el.style.borderRadius = '4px';
    } else {
      // 미일치: 흐리게
      el.style.background = '';
      el.style.color = '#CBD5E1';
      el.style.textDecoration = 'none';
      el.style.fontWeight = '400';
      el.style.opacity = '0.4';
    }
  });
};

/* 학생 이름 마우스 오버 시 동일 학생 전체 강조 */
window.highlightPLStudent = function(name, on) {
  document.querySelectorAll('[data-stuname]').forEach(el => {
    if (el.getAttribute('data-stuname') === name) {
      if (on) {
        el.style.background = '#FEF3C7';
        el.style.color = '#92400E';
        el.style.textDecoration = 'none';
        el.style.fontWeight = '800';
      } else {
        el.style.background = '';
        el.style.color = 'var(--primary)';
        el.style.textDecoration = 'underline';
        el.style.fontWeight = '600';
      }
    }
  });
};

window.saveEditPLClass=async function(termId,classId){
  const t=getPLTerm(termId); const cls=t?.classes.find(c=>c.id===classId); if(!cls) return;
  cls.name=document.getElementById('eCN').value.trim();
  cls.day=document.getElementById('eCD').value;
  cls.time=document.getElementById('eCT').value.trim();
  cls.teacher=document.getElementById('eTch').value.trim();
  await savePLDB(); window.closeModal(); view={page:'pl-terms',plTermId:termId}; render(); showToast('✅ 저장됨','success');
};

/* 반 수정 모달 - 학생 추가 */
window.addStudentFromClassEdit = async function(classId, termId) {
  const name = document.getElementById('newStuName')?.value.trim();
  const grade = document.getElementById('newStuGrade')?.value;
  const school = document.getElementById('newStuSchool')?.value.trim();
  if (!name) { showToast('⚠️ 이름을 입력해주세요'); return; }
  const data = getPLClassData(classId);
  if (data.students.some(s => s.name === name)) { showToast('⚠️ 이미 이 반에 등록된 학생입니다'); return; }

  // 2번: 현재 분기 내 동일 학생(이름+학년+학교) 체크
  const term = getPLTerm(termId);
  const termClassIds = new Set((term?.classes||[]).map(c=>c.id));
  const existingStu = Object.entries(pl_db.students).find(([sid, stu]) => {
    if (stu.name !== name) return false;
    if (grade && stu.grade && stu.grade !== grade) return false;
    if (school && stu.school && stu.school !== school) return false;
    // 이 분기에 속한 학생인지 확인
    return [...termClassIds].some(cid => pl_db.classes[cid]?.students?.some(s=>s.id===sid));
  });

  let sid;
  if (existingStu) {
    // 기존 학생에 이 반만 추가
    sid = existingStu[0];
    showToast(`✅ 기존 학생 '${name}'을 이 반에 추가했습니다`, 'success');
  } else {
    sid = uid();
    pl_db.students[sid] = { name, school: school||'', grade: grade||'', course:'', period:'', endMonth:'', memo:'', sentLog:{}, history:[] };
    showToast(`✅ '${name}' 추가 완료`, 'success');
  }
  data.students.push({ id: sid, name });
  await savePLDB();
  window.editPLClass(termId, classId);
};

/* 반 수정 모달 - 학생 삭제 */
window.removeStudentFromClassEdit = function(sid, classId, termId) {
  const stu = pl_db.students[sid];
  showConfirm(`'${stu?.name}' 학생을 이 반에서 삭제할까요?`, async () => {
    const data = getPLClassData(classId);
    data.students = data.students.filter(s => s.id !== sid);
    await savePLDB();
    showToast('🗑️ 삭제됨');
    window.editPLClass(termId, classId); // 모달 새로고침
  });
};
window.copyPLStudents=async function(){
  const fromId=document.getElementById('plCopyFrom').value;
  const toId=document.getElementById('plCopyTo').value;
  if(!fromId||!toId){showToast('⚠️ 원본 반과 대상 반을 선택해주세요');return;}
  const fromData=getPLClassData(fromId); const toData=getPLClassData(toId);
  const existNames=new Set(toData.students.map(s=>s.name));
  const news=fromData.students.filter(s=>s.name&&!existNames.has(s.name)).map(s=>{
    const orig=pl_db.students[s.id]||{};
    const nid='pl_'+uid();
    pl_db.students[nid]={name:s.name,school:orig.school||'',grade:orig.grade||'',course:'',period:'',endMonth:'',memo:'',sentLog:{},history:[]};
    return {id:nid,name:s.name};
  });
  toData.students.push(...news);
  await savePLDB(); render(); showToast(`✅ ${news.length}명 복사 완료`,'success');
};

window.confirmPLAddStudent=async function(){
  const name=document.getElementById('plAddName').value.trim();
  const grade=document.getElementById('plAddGrade').value;
  const school=document.getElementById('plAddSchool').value.trim();
  if(!name){showToast('⚠️ 이름을 입력해주세요');return;}
  const classId=view.plClassId; const data=getPLClassData(classId);
  if(data.students.some(s=>s.name===name)){showToast('⚠️ 이미 이 반에 등록된 학생입니다');return;}

  // 2번: 현재 분기 내 동일 학생 체크
  const termId=view.plTermId;
  const term=getPLTerm(termId);
  const termClassIds=new Set((term?.classes||[]).map(c=>c.id));
  const existingStu=Object.entries(pl_db.students).find(([sid,stu])=>{
    if(stu.name!==name) return false;
    if(grade&&stu.grade&&stu.grade!==grade) return false;
    if(school&&stu.school&&stu.school!==school) return false;
    return [...termClassIds].some(cid=>pl_db.classes[cid]?.students?.some(s=>s.id===sid));
  });

  let sid;

    sid=existingStu[0];

  } else {

      course:document.getElementById('plAddCourse').value.trim(),
      period:document.getElementById('plAddPeriod').value.trim(),
      endMonth:document.getElementById('plAddEndMonth').value.trim(),
      memo:document.getElementById('plAddMemo').value.trim(),
      kakaoUrl:document.getElementById('plAddKakao')?.value.trim()||'',
      sentLog:{},history:[]};
    showToast(`✅ '${name}' 추가 완료`,'success');
  }
  data.students.push({id:sid,name});
  await savePLDB(); document.getElementById('plAddStudentModal').style.display='none';
  renderPLStudentTabs();
};

/* 해당 학생의 이 반 발송목록을 우측 카드에 렌더링 */
function updatePLStudentHistory(sid, classId) {
  const stu = pl_db.students[sid];
  const title = document.getElementById('plStudentHistoryTitle');
  const subtitle = document.getElementById('plStudentHistorySubtitle');
  const body = document.getElementById('plStudentHistoryBody');
  if (!title || !body) return;

  // 현재 분기의 모든 반 classId 목록
  const termId = view.plTermId;
  const term = getPLTerm(termId);
  const termClassIds = new Set(term ? term.classes.map(c => c.id) : []);

  // 이 분기 안에서 이 학생이 발송한 전체 이력
  const hist = (stu?.history || [])
    .filter(h => termClassIds.has(h.classId))
    .sort((a,b) => b.sentAt - a.sentAt);

  title.textContent = (stu?.name || '') + ' 발송 목록';
  subtitle.textContent = '이 분기 전체 발송 ' + hist.length + '건';

  if (hist.length === 0) {
    body.innerHTML = `<div style="padding:24px;text-align:center;color:var(--text-secondary);font-size:13px;">발송된 문자가 없습니다</div>`;
    return;
  }

  hist.forEach((h, hi) => {
    const safeId = 'plsh_' + (h.id || hi);
    window['_plMsg_' + safeId] = h.text || '';
    window['_plMeta_' + safeId] = {
      date: h.date,
      studentName: h.studentName || (stu ? stu.name : ''),
      className: h.className || classId
    };
  });

  body.innerHTML = `<table class="msg-table">
    <thead><tr><th class="col-date">날짜</th><th>반</th><th>회차</th><th>내용</th><th></th></tr></thead>
    <tbody>
      ${hist.map((h, hi) => {
        const safeId = 'plsh_' + (h.id || hi);
        return `<tr class="clickable" onclick="window.viewPLMsgById('${safeId}')">
          <td class="col-date" style="white-space:nowrap;">${escapeHtml(h.date)}</td>
          <td style="white-space:nowrap;font-size:12px;">${escapeHtml(h.className || '-')}</td>
          <td style="text-align:center;white-space:nowrap;">${escapeHtml(h.sessionNum || '-')}회</td>
          <td class="col-full">${escapeHtml((h.text || '').replace(/\n/g,' ').slice(0,30))}...</td>
          <td style="white-space:nowrap;">
            <button class="btn btn-outline btn-sm"
              onclick="event.stopPropagation();navigator.clipboard.writeText(window['_plMsg_${safeId}']||'').then(()=>showToast('✅ 복사됨','success'))">복사</button>
            <button class="btn btn-danger btn-sm" style="margin-left:3px;"
              onclick="event.stopPropagation();window.deletePLSentMsgById('${h.id}','${sid}','${classId}')">삭제</button>
          </td>
        </tr>`;
      }).join('')}
    </tbody>
  </table>`;
}

  const y = document.getElementById('plDateY_'+sid)?.value || '';

// 날짜 포맷
function formatPLDate(val) {
  if (!val) return '';
  // 이미 변환된 형식이면 그대로
  if (!/^\d{4}-\d{2}-\d{2}$/.test(val)) return val;
  const days = ['일','월','화','수','목','금','토'];
  const d = new Date(val + 'T00:00:00');
  return `${d.getMonth()+1}/${d.getDate()}(${days[d.getDay()]})`;
}

function buildPLMsg(course, name, date, sn, lc, hw, testScore, testMax, hwGrade, testRange, cmt) {
  const n = name || '학생';
  const cr = course || '';
  let m = '';
  if (date) m += `${date}\n`;
  m += `${n}학생의 ${cr} ${sn ? sn+'회차' : ''} 수업안내\n\n`;
  if (lc) m += `■ L-Class진도\n${lc}\n\n`;
  if (hw) m += `■ 가정학습 과제\n${hw}\n\n`;
  if (hwGrade) m += `* 과제이행 등급 : ${hwGrade}\n`;
  if (testRange) m += `* 일일TEST범위 : ${testRange}\n`;
  if (testScore) m += `* 일테결과 : ${testScore}점${testMax ? ` / ${testMax}점 만점` : ''}\n`;
  if (hwGrade || testRange || testScore) m += '\n';
  if (cmt) m += cmt;
  return m.trim();
}

function getPLCurrentMsg(sid) {
  const stu=pl_db.students[sid]; if(!stu) return '';
  const g=id=>document.getElementById(id)?.value||'';

    g('plDate_'+sid),

    g('plHW_'+sid),
    g('plTestScore_'+sid),
    g('plTestMax_'+sid),

  );
}

window.savePLSess=async function(sid){
  const data=getPLClassData(view.plClassId);
  const g=id=>document.getElementById(id)?.value||'';

  const entry={
    studentId: sid,

    course:    g('plCourse_'+sid),
    lclass:    g('plLC_'+sid),
    homework:  g('plHW_'+sid),
    testScore: g('plTestScore_'+sid),
    testMax:   g('plTestMax_'+sid),
    hwGrade:   g('plHwGrade_'+sid),

window.markPLSent=async function(sid){
  const target = sid || plView.studentId;
  if(!target){showToast('⚠️ 학생을 먼저 선택해주세요');return;}

  const classId=view.plClassId; const data=getPLClassData(classId);
  const g=id=>document.getElementById(id)?.value||'';
  const dateVal=g('plDate_'+target)||data.currentDate||'';
  data.currentDate=dateVal;

  // 세션 저장 (토스트 없이)
  const entry={
    studentId:target, date:dateVal,
    sessionNum:g('plSess_'+target),
    course:    g('plCourse_'+target),
    lclass:    g('plLC_'+target),
    homework:  g('plHW_'+target),
    testScore: g('plTestScore_'+target),
    testMax:   g('plTestMax_'+target),
    hwGrade:   g('plHwGrade_'+target),
    testRange: g('plTestRange_'+target),
    comment:   g('plCmt_'+target)
  };
  if(!data.sessions)data.sessions=[];
  const si=data.sessions.findIndex(s=>s.studentId===target);
  if(si>=0)data.sessions[si]=entry;else data.sessions.push(entry);

  // 발송 이력 저장
  if(!pl_db.students[target].sentLog)pl_db.students[target].sentLog={};
  pl_db.students[target].sentLog[classId+'_'+dateVal]=true;
  // 발송 이력을 학생 단위로 저장 (반 이동해도 보존)
  if(!pl_db.students[target].history)pl_db.students[target].history=[];
  const stu=pl_db.students[target];
  const msg=getPLCurrentMsg(target);
  // 반 이름 조회
  const clsDef = pl_db.terms.flatMap(t=>t.classes).find(c=>c.id===classId);
  const className = clsDef ? clsDef.name : classId;
  const histEntry={id:uid(),classId,className,studentId:target,studentName:stu.name,date:dateVal,
    sessionNum:g('plSess_'+target),text:msg,sentAt:Date.now()};
  const ei=pl_db.students[target].history.findIndex(h=>h.classId===classId && h.date===dateVal);
  if(ei>=0)pl_db.students[target].history[ei]=histEntry;else pl_db.students[target].history.push(histEntry);

  await savePLDB();
  renderPLStudentTabs();
  updatePLStudentHistory(target, classId);
  showToast('✅ 발송목록에 저장되었습니다','success');
};

/* PL 전체 학생 명단 + 수강현황 */
function renderPLRoster(){
  const termId = view.plTermId;
  const term = getPLTerm(termId);
  if (!term) return `<div class="empty-state">분기를 찾을 수 없습니다</div>`;

  // 이 분기의 반에 등록된 학생 목록 (가나다순, 중복 제거)
  const stuSet = new Map(); // sid → {stu, classes:[]}
  term.classes.forEach(cls => {
    (pl_db.classes[cls.id]?.students || []).forEach(s => {
      if (!stuSet.has(s.id)) stuSet.set(s.id, { stu: pl_db.students[s.id], classes: [] });
      stuSet.get(s.id).classes.push(cls.name);
    });
  });
  const students = [...stuSet.entries()]
    .filter(([, v]) => v.stu)
    .sort(([, a], [, b]) => a.stu.name.localeCompare(b.stu.name, 'ko'));

  // 학생별 이 분기 발송이력 최근 3개
  const termClassIds = new Set(term.classes.map(c => c.id));
  const stuHistory = {};
  students.forEach(([sid, {stu}]) => {
    const seen = new Set();
    stuHistory[sid] = (stu.history || [])
      .filter(h => termClassIds.has(h.classId))
      .filter(h => { if(seen.has(h.date)) return false; seen.add(h.date); return true; })
      .sort((a,b) => b.sentAt - a.sentAt)
      .slice(0, 3);
  });

  return `
    <div class="page-title-row">
      <div>
        <button class="btn btn-outline btn-sm" onclick="window.plGo('terms','${termId}')" style="margin-bottom:8px;">← 반 목록</button>
        <div class="page-title" style="color:#F59E0B;">👥 ${escapeHtml(term.name)} 전체 학생 명단</div>
